name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm gera o crivo-linux-arm64 nativamente (cgo sem cross).
        # Windows arm64 fica de fora: o cgo no runner windows-11-arm não foi
        # verificado e uma perna falhando bloquearia o release.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Toolchain C (pg_query usa cgo)
        if: runner.os == 'Windows'
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      # internal/integration sobe Postgres via testcontainers onde há Docker; o
      # runner arm64 também tem Docker, então lá o pacote fica de fora.
      - name: Testes
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            go test $(go list ./... | grep -v '/internal/integration$')
          else
            go test ./...
          fi
      # testcontainers-go sobe o Postgres onde há Docker; só na perna Linux amd64
      - name: Integração
        if: matrix.os == 'ubuntu-latest'
        run: go test -v ./internal/integration/
      # Em tag vX.Y.Z a versão é a própria tag; fora dela, o hash curto
      # (mesmo formato do `git describe --tags --always` do Makefile).
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Os nomes dos binários não levam versão de propósito: assim o link
      # /releases/latest/download/crivo-<os>-<arch> do README é estável.
      - name: Build
        run: |
          # tr em vez de ${VAR,,}: o /bin/bash do macOS é 3.2 e não suporta
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ext=""; extld=""
          # Windows: linka estático para não depender do libwinpthread-1.dll do MinGW,
          # que não existe numa máquina comum (o exe sai calado com 0xC0000135)
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; extld="-extldflags=-static"; fi
          go build -trimpath -ldflags "-s -w $extld -X crivo/internal/cli.Version=${{ steps.ver.outputs.version }}" -o "dist/crivo-${os}-$(go env GOARCH)${ext}" ./cmd/crivo
      # O PATH do runner tem o mingw64\bin, então o smoke test passaria mesmo com
      # DLL faltando: confere a tabela de imports em vez de confiar na execução.
      - name: Sem DLL do MinGW
        if: runner.os == 'Windows'
        run: |
          objdump -p dist/crivo-windows-*.exe | grep "DLL Name"
          if objdump -p dist/crivo-windows-*.exe | grep -iE "DLL Name: lib"; then
            echo "o exe depende de DLL do MinGW"; exit 1
          fi
      # A tabela de imports é inferência; aqui o exe roda de fato com o PATH de
      # uma máquina Windows comum (só System32), sem o mingw64\bin do runner.
      - name: Executa sem MinGW no PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\crivo-windows-*.exe).FullName
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "crivo version saiu com $LASTEXITCODE" }
      - name: Smoke test do binário
        run: |
          bin=$(ls dist/crivo-*)
          "$bin" version
          # sem argumentos precisa mostrar a ajuda (antes saía mudo e parecia fechar)
          out=$("$bin")
          [[ "$out" == *"Usage: crivo"* ]] || { echo "crivo sem argumentos não mostrou a ajuda"; exit 1; }
          "$bin" check --offline examples/vendas.crivo
          # fluxo principal sem banco: schema vindo do DDL, casos com o esperado
          "$bin" test examples/vendas.crivo --schema-sql testdata/schema.sql -f examples/queries.sql > /dev/null
          "$bin" build --offline examples/vendas.crivo -o dist/vendas-smoke
          # sem "| head" direto: com pipefail, o SIGPIPE do head vira exit 141
          out=$(dist/vendas-smoke* policy)
          echo "$out" | head -3
          out=$(dist/vendas-smoke*)
          [[ "$out" == *"Usage: vendas"* ]] || { echo "binário gerado sem argumentos não mostrou a ajuda"; exit 1; }
      # O runner macOS é arm64; o clang da Apple cross-compila x86_64 com cgo
      # sem toolchain extra (o Go passa -arch x86_64 sozinho).
      - name: Build macOS Intel
        if: runner.os == 'macOS'
        env:
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X crivo/internal/cli.Version=${{ steps.ver.outputs.version }}" -o dist/crivo-macos-amd64 ./cmd/crivo
          file dist/crivo-macos-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: crivo-${{ matrix.os }}
          path: dist/crivo-*
          if-no-files-found: error

  # Dispara só em tag vX.Y.Z (ver `make tag`), depois que todas as pernas passaram.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    # permissions no job substitui o bloco do topo: lista as três.
    permissions:
      contents: write      # cria o release e commita Formula/ e bucket/ na main
      id-token: write      # OIDC do attest-build-provenance
      attestations: write  # grava a atestação de proveniência
    steps:
      # A main (não a tag) porque o último passo commita nela; vem antes do
      # download para não apagar o dist/.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: crivo-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum crivo-* > checksums.txt
          cat checksums.txt
      # Proveniência SLSA dos binários (verificável com `gh attestation verify`).
      # Fica antes da publicação: se falhar, o release não sai sem atestação.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/crivo-*
      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Crivo $GITHUB_REF_NAME" \
            --generate-notes $pre
      # Atualiza a fórmula do Homebrew e o manifesto do Scoop (tap/bucket neste
      # próprio repo) com as URLs versionadas e os SHA-256 deste release. Fica
      # por último para nunca bloquear a publicação; pré-releases não entram.
      # O push com o GITHUB_TOKEN não dispara outro workflow.
      - name: Atualiza Formula/ e bucket/
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          python3 -I scripts/packages.py "$GITHUB_REF_NAME" dist/checksums.txt
          git add Formula bucket
          if git diff --cached --quiet; then echo "Formula/ e bucket/ sem mudança"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(packages): Homebrew e Scoop para $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
