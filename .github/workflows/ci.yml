name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Toolchain C (pg_query usa cgo)
        if: runner.os == 'Windows'
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test ./...
      # testcontainers-go sobe o Postgres onde há Docker (Linux)
      - name: Integração
        if: runner.os == 'Linux'
        run: go test -v ./internal/integration/
      # Em tag vX.Y.Z a versão é a própria tag; fora dela, o hash curto
      # (mesmo formato do `git describe --tags --always` do Makefile).
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Os nomes dos binários não levam versão de propósito: assim o link
      # /releases/latest/download/crivo-<os>-<arch> do README é estável.
      - name: Build
        run: |
          # tr em vez de ${VAR,,}: o /bin/bash do macOS é 3.2 e não suporta
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X crivo/internal/cli.Version=${{ steps.ver.outputs.version }}" -o "dist/crivo-${os}-$(go env GOARCH)${ext}" ./cmd/crivo
      - name: Smoke test do binário
        run: |
          bin=$(ls dist/crivo-*)
          "$bin" version
          "$bin" check --offline examples/vendas.crivo
          "$bin" build --offline examples/vendas.crivo -o dist/vendas-smoke
          # sem "| head" direto: com pipefail, o SIGPIPE do head vira exit 141
          out=$(dist/vendas-smoke* policy)
          echo "$out" | head -3
      # O runner macOS é arm64; o clang da Apple cross-compila x86_64 com cgo
      # sem toolchain extra (o Go passa -arch x86_64 sozinho).
      - name: Build macOS Intel
        if: runner.os == 'macOS'
        env:
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X crivo/internal/cli.Version=${{ steps.ver.outputs.version }}" -o dist/crivo-macos-amd64 ./cmd/crivo
          file dist/crivo-macos-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: crivo-${{ matrix.os }}
          path: dist/crivo-*
          if-no-files-found: error

  # Dispara só em tag vX.Y.Z (ver `make tag`), depois que os três SOs passaram.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crivo-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum crivo-* > checksums.txt
          cat checksums.txt
      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Crivo $GITHUB_REF_NAME" \
            --generate-notes $pre
