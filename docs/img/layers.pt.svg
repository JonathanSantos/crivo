  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3EE08F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
