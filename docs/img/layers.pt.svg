<text x="740" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8A96A6" text-anchor="start" xml:space="preserve" >SET LOCAL a cada execução (timeout 5s)</text>
